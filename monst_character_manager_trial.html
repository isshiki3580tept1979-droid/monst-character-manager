<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>【試作】モンスト キャラ管理（初期版再現）</title>
<!--
  初期版（commit 6ae1d08「モンスト キャラ管理」）の画面構成・操作感を再現した試作版。
  保存領域は本番と完全に分離（本番キー monst-character-manager-v2 / -v1 / -device-names-v1 は読み書きしない）。
-->
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:16px 16px 12px;box-shadow:0 2px 10px #0002}
header h1{font-size:20px;margin:0 0 6px}
header p{font-size:12px;margin:0;color:#d1d5db}
.trialTag{display:inline-block;vertical-align:middle;margin-left:6px;background:#f59e0b;color:#111827;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0000000f}
h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px;color:#4b5563}
input,select,textarea,button{width:100%;font:inherit}
input,select,textarea{border:1px solid #d1d5db;border-radius:10px;padding:11px;background:white;color:#1f2937;min-width:0}
textarea{min-height:72px;resize:vertical}
button{border:0;border-radius:11px;padding:11px 12px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:1/-1}
.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:10px}
.itemTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px;font-size:11px;margin:3px 4px 0 0;overflow-wrap:anywhere}
.phone{background:#ecfdf5;color:#065f46}
.memo{font-size:13px;color:#4b5563;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{padding:8px}
.empty{text-align:center;color:#6b7280;padding:20px 8px}
.count{font-size:12px;color:#6b7280;margin-top:4px}
.formBtns{display:flex;gap:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>モンスト キャラ管理<span class="trialTag">初期版再現・試作</span></h1>
  <p>どのスマホに、どのキャラがいるかを確認</p>
</header>

<main>
  <section class="card">
    <h2 id="formTitle">キャラを登録</h2>
    <div class="grid">
      <div>
        <label for="phone">端末名</label>
        <input id="phone" list="phoneList" maxlength="20" placeholder="例：メイン、サブ1、サブ2">
        <datalist id="phoneList"></datalist>
      </div>
      <div>
        <label for="character">キャラ名</label>
        <input id="character" maxlength="40" placeholder="例：キャラクター名">
      </div>
      <div>
        <label for="quest">対象クエスト</label>
        <select id="quest"></select>
      </div>
      <div>
        <label for="stage">ステージ</label>
        <input id="stage" maxlength="20" placeholder="例：1、2、EX、最終">
      </div>
      <div class="full">
        <label for="role">役割・用途</label>
        <input id="role" maxlength="40" placeholder="例：適正、貸し出し用">
      </div>
      <div class="full">
        <label for="memo">メモ</label>
        <textarea id="memo" maxlength="300" placeholder="例：2体所持、わくわく厳選済み"></textarea>
      </div>
      <div class="full formBtns">
        <button class="secondary" id="cancelBtn" style="display:none;width:40%">キャンセル</button>
        <button class="primary" id="saveBtn">登録する</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>絞り込み</h2>
    <div class="filters">
      <input id="search" class="span2" placeholder="キャラ名・端末名で検索">
      <select id="filterQuest" aria-label="クエストで絞り込み"></select>
      <select id="filterStage" aria-label="ステージで絞り込み"></select>
      <select id="filterPhone" class="span2" aria-label="端末で絞り込み"></select>
    </div>
    <div class="count" id="count"></div>
  </section>

  <section class="card">
    <h2>登録一覧</h2>
    <div id="list"></div>
  </section>
</main>

<script>
// 試作版専用の保存キー（本番の monst-character-manager-v2 / -v1 / -device-names-v1 とは別。移行処理もしない）
const KEY='monst-character-manager-trial-v1';
const QUESTS=['禁忌の獄','破界の星墓','天魔の孤城','その他'];
const PHONES=['メイン','サブ1','サブ2','サブ3','サブ4'];
let editingId=null;
const $=id=>document.getElementById(id);

function load(){
  try{
    const v=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(Array.isArray(v)) return v.filter(x=>x&&typeof x==='object');
  }catch{}
  return [];
}
function save(data){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=''){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function naturalSort(a,b){
  return String(a).localeCompare(String(b),'ja',{numeric:true,sensitivity:'base'});
}
function options(values,allLabel,current){
  return `<option value="">${allLabel}</option>`+values.map(v=>
    `<option value="${esc(v)}"${v===current?' selected':''}>${esc(v)}</option>`).join('');
}

function resetForm(){
  editingId=null;
  $('phone').value='';
  $('character').value='';
  $('quest').value=$('filterQuest').value||'';
  $('stage').value=$('filterStage').value||'';
  $('role').value='';
  $('memo').value='';
  $('saveBtn').textContent='登録する';
  $('formTitle').textContent='キャラを登録';
  $('cancelBtn').style.display='none';
}

function renderFilters(data){
  const fq=$('filterQuest').value, fs=$('filterStage').value, fp=$('filterPhone').value;
  const stages=[...new Set(data.filter(x=>!fq||x.quest===fq).map(x=>x.stage).filter(Boolean))].sort(naturalSort);
  const phones=[...new Set([...PHONES,...data.map(x=>x.phone).filter(Boolean)])];
  $('filterQuest').innerHTML=options(QUESTS,'全クエスト',fq);
  $('filterStage').innerHTML=options(stages,'全ステージ',stages.includes(fs)?fs:'');
  $('filterPhone').innerHTML=options(phones,'全端末',fp);
  $('phoneList').innerHTML=phones.map(p=>`<option value="${esc(p)}">`).join('');
}

function render(){
  const data=load();
  renderFilters(data);
  const q=$('search').value.trim().toLowerCase();
  const fq=$('filterQuest').value, fs=$('filterStage').value, fp=$('filterPhone').value;
  const shown=data.filter(x=>{
    const hit=!q || [x.phone,x.character,x.role,x.memo].join(' ').toLowerCase().includes(q);
    return hit && (!fq||x.quest===fq) && (!fs||x.stage===fs) && (!fp||x.phone===fp);
  });
  $('count').textContent=`${shown.length}件表示 / 全${data.length}件`;
  const list=$('list');
  if(!shown.length){
    list.innerHTML=`<div class="empty">${data.length?'条件に合う登録がありません':'まだ登録がありません'}</div>`;
    return;
  }
  list.innerHTML=shown.map(x=>`
    <div class="item">
      <div class="itemTop">
        <div>
          <div class="name">${esc(x.character)}</div>
          <span class="badge phone">${esc(x.phone)}</span>
          ${x.quest?`<span class="badge">${esc(x.quest)}${x.stage?' '+esc(x.stage):''}</span>`:''}
          ${x.role?`<span class="badge">${esc(x.role)}</span>`:''}
        </div>
      </div>
      ${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}
      <div class="actions">
        <button class="secondary" data-edit="${esc(x.id)}">編集</button>
        <button class="danger" data-delete="${esc(x.id)}">削除</button>
      </div>
    </div>
  `).join('');
}

$('saveBtn').addEventListener('click',()=>{
  const phone=$('phone').value.trim();
  const character=$('character').value.trim();
  if(!phone||!character){
    alert('端末名とキャラ名を入力してください');
    return;
  }
  const item={
    id:editingId||String(Date.now()),
    phone,
    character,
    quest:$('quest').value,
    stage:$('stage').value.trim(),
    role:$('role').value.trim(),
    memo:$('memo').value.trim()
  };
  let data=load();
  if(editingId){
    data=data.map(x=>x.id===editingId?item:x);
  }else{
    data.unshift(item);
  }
  save(data);
  resetForm();
  render();
});
$('cancelBtn').addEventListener('click',resetForm);

function editItem(id){
  const x=load().find(v=>v.id===id);
  if(!x)return;
  editingId=id;
  $('phone').value=x.phone||'';
  $('character').value=x.character||'';
  $('quest').value=x.quest||'';
  $('stage').value=x.stage||'';
  $('role').value=x.role||'';
  $('memo').value=x.memo||'';
  $('saveBtn').textContent='更新する';
  $('formTitle').textContent='登録内容を編集';
  $('cancelBtn').style.display='';
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteItem(id){
  if(!confirm('この登録を削除しますか？'))return;
  save(load().filter(x=>x.id!==id));
  if(editingId===id)resetForm();
  render();
}

$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  if(b.dataset.edit)editItem(b.dataset.edit);
  if(b.dataset.delete)deleteItem(b.dataset.delete);
});
$('search').addEventListener('input',render);
$('filterQuest').addEventListener('change',()=>{$('filterStage').value='';render()});
$('filterStage').addEventListener('change',render);
$('filterPhone').addEventListener('change',render);

$('quest').innerHTML=`<option value="">未設定</option>`+QUESTS.map(q=>`<option>${q}</option>`).join('');
render();
</script>
</body>
</html>
