<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モンスト キャラ管理</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:16px 16px 12px;box-shadow:0 2px 10px #0002}
header h1{font-size:20px;margin:0 0 6px}
header p{font-size:12px;margin:0;color:#d1d5db}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0000000f}
h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;display:block;margin-bottom:4px;color:#4b5563}
input,select,textarea,button{width:100%;font:inherit}
input,select,textarea{border:1px solid #d1d5db;border-radius:10px;padding:11px;background:white}
textarea{min-height:72px;resize:vertical}
button{border:0;border-radius:11px;padding:11px 12px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#fee2e2;color:#991b1b}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:10px}
.itemTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:17px}
.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px;font-size:11px;margin:3px 4px 0 0}
.phone{background:#ecfdf5;color:#065f46}
.memo{font-size:13px;color:#4b5563;margin-top:8px;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{padding:8px}
.empty{text-align:center;color:#6b7280;padding:20px 8px}
.count{font-size:12px;color:#6b7280;margin-top:4px}
@media(max-width:560px){.grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>モンスト キャラ管理</h1>
  <p>どのスマホに、どのキャラがいるかを確認</p>
</header>

<main>
  <section class="card">
    <h2>キャラを登録</h2>
    <div class="grid">
      <div>
        <label>端末名</label>
        <input id="phone" placeholder="例：メイン、サブ1、サブ2">
      </div>
      <div>
        <label>キャラ名</label>
        <input id="character" placeholder="例：キャラクター名">
      </div>
      <div>
        <label>対象ステージ</label>
        <select id="stage">
          <option value="">未設定</option>
          <option>破壊の聖母</option>
          <option>天魔の孤城</option>
          <option>その他</option>
        </select>
      </div>
      <div>
        <label>役割・用途</label>
        <input id="role" placeholder="例：適正、貸し出し用">
      </div>
      <div class="full">
        <label>メモ</label>
        <textarea id="memo" placeholder="例：2体所持、わくわく厳選済み"></textarea>
      </div>
      <div class="full">
        <button class="primary" id="saveBtn">登録する</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>絞り込み</h2>
    <div class="filters">
      <input id="search" placeholder="キャラ名・端末名で検索">
      <select id="filterStage">
        <option value="">全ステージ</option>
        <option>破壊の聖母</option>
        <option>天魔の孤城</option>
        <option>その他</option>
      </select>
    </div>
    <div class="count" id="count"></div>
  </section>

  <section class="card">
    <h2>登録一覧</h2>
    <div id="list"></div>
  </section>
</main>

<script>
const KEY='monst-character-manager-v1';
let editingId=null;
const $=id=>document.getElementById(id);

function load(){
  try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}
}
function save(data){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function resetForm(){
  editingId=null;
  $('phone').value='';
  $('character').value='';
  $('stage').value='';
  $('role').value='';
  $('memo').value='';
  $('saveBtn').textContent='登録する';
}

function render(){
  const q=$('search').value.trim().toLowerCase();
  const fs=$('filterStage').value;
  let data=load();
  let shown=data.filter(x=>{
    const hit=!q || [x.phone,x.character,x.role,x.memo].join(' ').toLowerCase().includes(q);
    const stage=!fs || x.stage===fs;
    return hit&&stage;
  });
  $('count').textContent=`${shown.length}件表示 / 全${data.length}件`;
  const list=$('list');
  if(!shown.length){
    list.innerHTML='<div class="empty">まだ登録がありません</div>';
    return;
  }
  list.innerHTML=shown.map(x=>`
    <div class="item">
      <div class="itemTop">
        <div>
          <div class="name">${esc(x.character)}</div>
          <span class="badge phone">${esc(x.phone)}</span>
          ${x.stage?`<span class="badge">${esc(x.stage)}</span>`:''}
          ${x.role?`<span class="badge">${esc(x.role)}</span>`:''}
        </div>
      </div>
      ${x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}
      <div class="actions">
        <button class="secondary" onclick="editItem('${x.id}')">編集</button>
        <button class="danger" onclick="deleteItem('${x.id}')">削除</button>
      </div>
    </div>
  `).join('');
}

$('saveBtn').addEventListener('click',()=>{
  const phone=$('phone').value.trim();
  const character=$('character').value.trim();
  if(!phone||!character){
    alert('端末名とキャラ名を入力してください');
    return;
  }
  const item={
    id:editingId||String(Date.now()),
    phone,
    character,
    stage:$('stage').value,
    role:$('role').value.trim(),
    memo:$('memo').value.trim()
  };
  let data=load();
  if(editingId){
    data=data.map(x=>x.id===editingId?item:x);
  }else{
    data.unshift(item);
  }
  save(data);
  resetForm();
  render();
});

window.editItem=id=>{
  const x=load().find(v=>v.id===id);
  if(!x)return;
  editingId=id;
  $('phone').value=x.phone;
  $('character').value=x.character;
  $('stage').value=x.stage||'';
  $('role').value=x.role||'';
  $('memo').value=x.memo||'';
  $('saveBtn').textContent='更新する';
  window.scrollTo({top:0,behavior:'smooth'});
};

window.deleteItem=id=>{
  if(!confirm('この登録を削除しますか？'))return;
  save(load().filter(x=>x.id!==id));
  if(editingId===id)resetForm();
  render();
};

$('search').addEventListener('input',render);
$('filterStage').addEventListener('change',render);
render();
</script>
</body>
</html>
